# Vhost do Nginx do HOST (VPS) para o ComandaX.
#
# Instalação:
#   sudo cp deploy/nginx/comandax.conf /etc/nginx/sites-available/comandax.conf
#   sudo nano /etc/nginx/sites-available/comandax.conf   # troque SEU_DOMINIO
#   sudo ln -s /etc/nginx/sites-available/comandax.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois rode o certbot para gerar o bloco HTTPS automaticamente:
#   sudo certbot --nginx -d SEU_DOMINIO
#
# Se mudar COMANDAX_WEB_PORT no .env, ajuste a porta 8110 abaixo.

# Balde de requisições por IP: corta volume bruto antes de gastar um worker.
# Folgado de propósito — operadoras móveis colocam milhares de pessoas atrás
# de um mesmo IP (CGNAT), e garçons usam o 4G do celular no salão.
limit_req_zone $binary_remote_addr zone=comandax_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # HSTS: sem ele, o primeiro acesso em HTTP fica exposto a um atacante na
    # rede. O certbot cria o bloco 443, mas não adiciona este header sozinho.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /graphql {
        limit_req zone=comandax_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve em vez de anexar: o valor vindo do cliente não é confiável.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=comandax_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA e estáticos.
    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
