services:
  db:
    image: postgres:17-alpine
    container_name: comandax-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comandax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-comandax}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: comandax-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-comandax};Username=${POSTGRES_USER:-comandax};Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../comandax-front
    container_name: comandax-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMANDAX_WEB_PORT:-8110}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
